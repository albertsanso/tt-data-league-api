version: '3.7'
services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - 8081:8080
    environment:
      - API_URL=http://host.docker.internal:8080/openapi.yaml
    volumes:
      - ../../openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    restart: unless-stopped

# Usage:
# docker-compose -f docker/swagger-ui/docker-compose.yml up
# Then open http://localhost:8081 to view the spec. The container expects the API file to be served at the path configured in API_URL; the default above maps local openapi.yaml into the container.

